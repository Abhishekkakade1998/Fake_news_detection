<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
</head>
<body>
    <h2>Fake News Detection System</h2>

    <form action="/predict" method="post">
        <textarea name="news" rows="6" cols="60" required></textarea><br><br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h3>{{ prediction }}</h3>
        <p>Confidence: {{ probability }}</p>
    {% endif %}
</body>
</html>
